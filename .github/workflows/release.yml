name: Build client release
run-name: Build client release ${{ inputs.release_commit }} [${{ inputs.request_id }}]

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Exact reviewed main commit to package
        required: true
        type: string
      request_id:
        description: Unique caller correlation id
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: client-release
  cancel-in-progress: false

jobs:
  build-release:
    name: Test, build, and create draft
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out the exact dispatched commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.release_commit }}
          fetch-depth: 0

      - name: Verify checked-out release commit
        shell: powershell
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
        run: |
          if ($env:RELEASE_COMMIT -notmatch '^[0-9a-f]{40}$') {
            throw "Release commit is invalid: $env:RELEASE_COMMIT"
          }
          $checkedOutCommit = (git rev-parse HEAD).Trim()
          if ($checkedOutCommit -ne $env:RELEASE_COMMIT) {
            throw "Release checkout mismatch: $checkedOutCommit / $env:RELEASE_COMMIT"
          }
          git fetch origin main
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to fetch origin/main for release ancestry verification.'
          }
          git merge-base --is-ancestor $checkedOutCommit origin/main
          if ($LASTEXITCODE -ne 0) {
            throw 'The reviewed release commit is no longer part of origin/main.'
          }

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Install browser used by DOM tests
        run: python -m playwright install chromium

      - name: Validate PowerShell release and deployment scripts
        shell: powershell
        run: |
          $scripts = @(
            Get-ChildItem -LiteralPath 'scripts' -File -Filter '*.ps1'
          )
          foreach ($script in $scripts) {
            $errors = $null
            [void][Management.Automation.Language.Parser]::ParseFile(
              $script.FullName,
              [ref]$null,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | Format-List
              throw "PowerShell parser rejected $($script.FullName)"
            }
          }

      - name: Validate Linux deployment scripts
        shell: powershell
        run: |
          $bash = 'C:\Program Files\Git\bin\bash.exe'
          if (-not (Test-Path -LiteralPath $bash -PathType Leaf)) {
            throw 'Git Bash is required to validate Linux deployment scripts.'
          }
          $scripts = @(
            Get-ChildItem -LiteralPath 'deploy\server' -File -Filter '*.sh'
          )
          foreach ($script in $scripts) {
            & $bash -n $script.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "Bash parser rejected $($script.FullName)"
            }
          }

      - name: Run complete test suite
        run: python -m pytest -q

      - name: Download pinned Cloudflare login component
        shell: powershell
        run: .\scripts\download_cloudflared.ps1

      - name: Build packaged application
        shell: powershell
        run: |
          python -m PyInstaller --noconfirm --clean `
            --distpath "$PWD\release-staging\dist" `
            --workpath "$PWD\release-staging\build" `
            "$PWD\ERP_Automation.spec"
          if ($LASTEXITCODE -ne 0) {
            throw 'PyInstaller build failed.'
          }

      - name: Package stable release assets
        id: package
        shell: powershell
        run: |
          $version = (Get-Content CLIENT_VERSION -Raw).Trim()
          $releaseRoot = Join-Path $PWD 'release-output'
          $builtRoot = Join-Path $PWD 'release-staging\dist'
          $builtDirectories = @(Get-ChildItem -LiteralPath $builtRoot -Directory)
          if ($builtDirectories.Count -ne 1) {
            throw "Expected one packaged application directory, found $($builtDirectories.Count)."
          }
          [IO.Directory]::CreateDirectory($releaseRoot) | Out-Null
          .\scripts\package_shared_client.ps1 `
            -BuiltApplicationDir $builtDirectories[0].FullName `
            -Version $version `
            -OutputDirectory $releaseRoot `
            -ArchiveName 'ERP-Automation-Client.zip'
          .\scripts\create_release_manifest.ps1 `
            -PackagePath "$releaseRoot\ERP-Automation-Client.zip" `
            -Version $version `
            -OutputPath "$releaseRoot\latest.json"
          $digest = (
            Get-Content "$releaseRoot\latest.json" -Raw | ConvertFrom-Json
          ).package.sha256
          [IO.File]::WriteAllText(
            (Join-Path $releaseRoot 'SHA256SUMS.txt'),
            "$digest  ERP-Automation-Client.zip`n",
            [Text.UTF8Encoding]::new($false)
          )
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Run packaged smoke test
        shell: powershell
        run: |
          $smokeRoot = Join-Path $env:RUNNER_TEMP 'erp-release-smoke'
          $env:ERP_AUTOMATION_HOME = $smokeRoot
          $builtRoot = Join-Path $PWD 'release-staging\dist'
          $builtDirectories = @(Get-ChildItem -LiteralPath $builtRoot -Directory)
          if ($builtDirectories.Count -ne 1) {
            throw "Expected one packaged application directory, found $($builtDirectories.Count)."
          }
          $executables = @(
            Get-ChildItem -LiteralPath $builtDirectories[0].FullName -File -Filter '*.exe'
          )
          if ($executables.Count -ne 1) {
            throw "Expected one top-level application executable, found $($executables.Count)."
          }
          $process = Start-Process `
            -FilePath $executables[0].FullName `
            -ArgumentList '--release-smoke-test' `
            -PassThru
          if (-not $process.WaitForExit(120000)) {
            try {
              $process.Kill()
              [void]$process.WaitForExit(5000)
            } catch {
            }
            throw 'Packaged smoke test exceeded the 120 second limit.'
          }
          if ($process.ExitCode -ne 0) {
            throw "Packaged smoke test failed with exit code $($process.ExitCode)."
          }

      - name: Run full updater and installer smoke test
        shell: powershell
        run: |
          $smokeRoot = Join-Path $env:RUNNER_TEMP (
            'erp-release-install-' + [Guid]::NewGuid().ToString('N')
          )
          $previousLocalAppData = $env:LOCALAPPDATA
          try {
            $env:LOCALAPPDATA = Join-Path $smokeRoot 'local-appdata'
            $stateRoot = Join-Path $env:LOCALAPPDATA 'LingxingERP'
            $desktop = Join-Path $smokeRoot 'desktop'
            [IO.Directory]::CreateDirectory($desktop) | Out-Null
            $resultLines = @(
              .\scripts\update_shared_client.ps1 `
                -CurrentVersion '2000.01.01.1' `
                -ManifestFile "$PWD\release-output\latest.json" `
                -PackageFile "$PWD\release-output\ERP-Automation-Client.zip" `
                -StateRoot $stateRoot `
                -DesktopDirectory $desktop `
                -AssumeYes `
                -OutputJson
            )
            $result = $resultLines[-1] | ConvertFrom-Json
            if ($result.status -ne 'updated') {
              throw "Packaged updater returned unexpected status: $($result.status)"
            }
            if (-not (Test-Path -LiteralPath $result.application_path -PathType Leaf)) {
              throw 'Packaged updater did not install the application EXE.'
            }
            $manifest = Get-Content `
              "$PWD\release-output\latest.json" -Raw | ConvertFrom-Json
            $sumLine = (
              Get-Content "$PWD\release-output\SHA256SUMS.txt" -Raw
            ).Trim()
            $expectedSumLine = (
              "$($manifest.package.sha256)  ERP-Automation-Client.zip"
            )
            if ($sumLine -ne $expectedSumLine) {
              throw 'SHA256SUMS.txt does not match the release manifest.'
            }
          } finally {
            $env:LOCALAPPDATA = $previousLocalAppData
            if (Test-Path -LiteralPath $smokeRoot -PathType Container) {
              Remove-Item -LiteralPath $smokeRoot -Recurse -Force
            }
          }

      - name: Create or update draft release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.package.outputs.tag }}
          RELEASE_VERSION: ${{ steps.package.outputs.version }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
        run: |
          $releases = @(
            gh release list --limit 100 --json tagName,isDraft | ConvertFrom-Json
          )
          $release = $releases | Where-Object {
            $_.tagName -eq $env:RELEASE_TAG
          } | Select-Object -First 1
          if ($null -ne $release) {
            if (-not $release.isDraft) {
              throw "Release $env:RELEASE_TAG is already published."
            }
            gh release upload $env:RELEASE_TAG `
              'release-output\ERP-Automation-Client.zip' `
              'release-output\latest.json' `
              'release-output\SHA256SUMS.txt' `
              --clobber
          } else {
            gh release create $env:RELEASE_TAG `
              'release-output\ERP-Automation-Client.zip' `
              'release-output\latest.json' `
              'release-output\SHA256SUMS.txt' `
              --draft `
              --target $env:RELEASE_COMMIT `
              --title "ERP Automation Client $env:RELEASE_VERSION" `
              --notes "Full tests, Windows packaging, and an isolated smoke test passed. The release remains outside the stable update channel until the matching server deployment is healthy."
          }

      - name: Preserve release assets for review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ERP-Automation-Client-${{ steps.package.outputs.version }}
          path: release-output/*
          if-no-files-found: error
          retention-days: 14
