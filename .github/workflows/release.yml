name: Build client release
run-name: Build client release ${{ inputs.release_commit }} [${{ inputs.request_id }}]

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Exact reviewed main commit to publish
        required: true
        type: string
      ci_run_id:
        description: Successful Tests workflow run for the exact release commit
        required: true
        type: string
      request_id:
        description: Unique caller correlation id
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: client-release
  cancel-in-progress: false

jobs:
  create-draft:
    name: Reuse verified CI candidate and create draft
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out the exact dispatched commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.release_commit }}
          fetch-depth: 0

      - name: Verify release commit and reusable CI run
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
        run: |
          if ($env:RELEASE_COMMIT -notmatch '^[0-9a-f]{40}$') {
            throw "Release commit is invalid: $env:RELEASE_COMMIT"
          }
          if ($env:CI_RUN_ID -notmatch '^[1-9][0-9]*$') {
            throw "CI run id is invalid: $env:CI_RUN_ID"
          }
          $checkedOutCommit = (git rev-parse HEAD).Trim()
          if ($checkedOutCommit -ne $env:RELEASE_COMMIT) {
            throw "Release checkout mismatch: $checkedOutCommit / $env:RELEASE_COMMIT"
          }
          git fetch origin main
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to fetch origin/main for release ancestry verification.'
          }
          git merge-base --is-ancestor $checkedOutCommit origin/main
          if ($LASTEXITCODE -ne 0) {
            throw 'The reviewed release commit is no longer part of origin/main.'
          }

          $runOutput = gh api (
            "/repos/$env:GITHUB_REPOSITORY/actions/runs/$env:CI_RUN_ID"
          )
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to read reusable CI run: $env:CI_RUN_ID"
          }
          $workflowOutput = gh api (
            "/repos/$env:GITHUB_REPOSITORY/actions/workflows/test.yml"
          )
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to resolve the trusted Tests workflow.'
          }
          $run = ($runOutput -join "`n") | ConvertFrom-Json
          $workflow = ($workflowOutput -join "`n") | ConvertFrom-Json
          if ([int64]$run.workflow_id -ne [int64]$workflow.id) {
            throw 'The supplied CI run belongs to a different workflow.'
          }
          if ([string]$run.head_repository.full_name -ne $env:GITHUB_REPOSITORY) {
            throw 'The supplied CI run belongs to a different repository.'
          }
          if ([string]$run.head_branch -ne 'main' -or [string]$run.event -ne 'push') {
            throw 'Reusable CI must be a push run from main.'
          }
          if ([string]$run.head_sha -ne $env:RELEASE_COMMIT) {
            throw (
              'Reusable CI commit mismatch: ' +
              "$($run.head_sha) / $env:RELEASE_COMMIT"
            )
          }
          if (
            [string]$run.status -ne 'completed' -or
            [string]$run.conclusion -ne 'success'
          ) {
            throw 'Reusable CI has not completed successfully.'
          }

      - name: Download smoke-tested client candidate from the verified CI run
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
        run: |
          gh run download $env:CI_RUN_ID `
            --name "ERP-Automation-Client-$env:RELEASE_COMMIT" `
            --dir release-output
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to download the exact reusable CI client candidate.'
          }

      - name: Revalidate reusable release assets
        id: package
        shell: powershell
        run: |
          $version = (Get-Content CLIENT_VERSION -Raw).Trim()
          if ($version -notmatch '^\d{4}\.\d{2}\.\d{2}\.\d+$') {
            throw "CLIENT_VERSION is invalid: $version"
          }
          $releaseRoot = Join-Path $PWD 'release-output'
          $packagePath = Join-Path $releaseRoot 'ERP-Automation-Client.zip'
          $manifestPath = Join-Path $releaseRoot 'latest.json'
          $sumsPath = Join-Path $releaseRoot 'SHA256SUMS.txt'
          $requiredNames = @(
            'ERP-Automation-Client.zip',
            'latest.json',
            'SHA256SUMS.txt'
          )
          $actualNames = @(
            Get-ChildItem -LiteralPath $releaseRoot -File |
              ForEach-Object { $_.Name }
          )
          foreach ($requiredName in $requiredNames) {
            if ($requiredName -notin $actualNames) {
              throw "Reusable CI artifact is missing: $requiredName"
            }
          }
          if (@($actualNames | Where-Object { $_ -notin $requiredNames }).Count) {
            throw 'Reusable CI artifact contains unexpected top-level files.'
          }

          $recomputedPath = Join-Path $env:RUNNER_TEMP 'recomputed-latest.json'
          .\scripts\create_release_manifest.ps1 `
            -PackagePath $packagePath `
            -Version $version `
            -OutputPath $recomputedPath | Out-Null
          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          $recomputed = Get-Content $recomputedPath -Raw | ConvertFrom-Json
          if (
            [int]$manifest.schema_version -ne 1 -or
            [string]$manifest.version -ne $version -or
            $manifest.mandatory -ne $true -or
            [string]$manifest.package.name -ne
              [string]$recomputed.package.name -or
            [string]$manifest.package.url -ne
              [string]$recomputed.package.url -or
            [string]$manifest.package.sha256 -ne
              [string]$recomputed.package.sha256 -or
            [string]$manifest.package.content_sha256 -ne
              [string]$recomputed.package.content_sha256 -or
            [int64]$manifest.package.size -ne
              [int64]$recomputed.package.size
          ) {
            throw 'Reusable CI manifest does not match the packaged client.'
          }
          $expectedSumLine = (
            "$($recomputed.package.sha256)  ERP-Automation-Client.zip"
          )
          $actualSumLine = (Get-Content $sumsPath -Raw).Trim()
          if ($actualSumLine -ne $expectedSumLine) {
            throw 'Reusable CI SHA256SUMS.txt does not match the packaged client.'
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Create or update draft release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.package.outputs.tag }}
          RELEASE_VERSION: ${{ steps.package.outputs.version }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
        run: |
          $releases = @(
            gh release list --limit 100 --json tagName,isDraft | ConvertFrom-Json
          )
          $release = $releases | Where-Object {
            $_.tagName -eq $env:RELEASE_TAG
          } | Select-Object -First 1
          if ($null -ne $release) {
            if (-not $release.isDraft) {
              throw "Release $env:RELEASE_TAG is already published."
            }
            gh release upload $env:RELEASE_TAG `
              'release-output\ERP-Automation-Client.zip' `
              'release-output\latest.json' `
              'release-output\SHA256SUMS.txt' `
              --clobber
          } else {
            gh release create $env:RELEASE_TAG `
              'release-output\ERP-Automation-Client.zip' `
              'release-output\latest.json' `
              'release-output\SHA256SUMS.txt' `
              --draft `
              --target $env:RELEASE_COMMIT `
              --title "ERP Automation Client $env:RELEASE_VERSION" `
              --notes "Reused successful full CI run $env:CI_RUN_ID for this exact main commit. Complete tests and the parallel Windows build, packaged smoke test, and updater/installer smoke test passed. The release remains outside the stable update channel until the matching server deployment is healthy."
          }
