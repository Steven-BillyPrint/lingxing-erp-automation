name: Build client release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: client-release
  cancel-in-progress: false

jobs:
  build-release:
    name: Test, build, and create draft
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out the exact dispatched commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify checked-out release commit
        shell: powershell
        run: |
          $checkedOutCommit = (git rev-parse HEAD).Trim()
          if ($checkedOutCommit -ne $env:GITHUB_SHA) {
            throw "Release checkout mismatch: $checkedOutCommit / $env:GITHUB_SHA"
          }

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Install browser used by DOM tests
        run: python -m playwright install chromium

      - name: Run complete test suite
        run: python -m pytest -q

      - name: Download pinned Cloudflare login component
        shell: powershell
        run: .\scripts\download_cloudflared.ps1

      - name: Build packaged application
        shell: powershell
        run: |
          python -m PyInstaller --noconfirm --clean `
            --distpath "$PWD\release-staging\dist" `
            --workpath "$PWD\release-staging\build" `
            "$PWD\ERP_Automation.spec"
          if ($LASTEXITCODE -ne 0) {
            throw 'PyInstaller build failed.'
          }

      - name: Package stable release assets
        id: package
        shell: powershell
        run: |
          $version = (Get-Content CLIENT_VERSION -Raw).Trim()
          $releaseRoot = Join-Path $PWD 'release-output'
          $builtRoot = Join-Path $PWD 'release-staging\dist'
          $builtDirectories = @(Get-ChildItem -LiteralPath $builtRoot -Directory)
          if ($builtDirectories.Count -ne 1) {
            throw "Expected one packaged application directory, found $($builtDirectories.Count)."
          }
          [IO.Directory]::CreateDirectory($releaseRoot) | Out-Null
          .\scripts\package_shared_client.ps1 `
            -BuiltApplicationDir $builtDirectories[0].FullName `
            -Version $version `
            -OutputDirectory $releaseRoot `
            -ArchiveName 'ERP-Automation-Client.zip'
          .\scripts\create_release_manifest.ps1 `
            -PackagePath "$releaseRoot\ERP-Automation-Client.zip" `
            -Version $version `
            -OutputPath "$releaseRoot\latest.json"
          $digest = (
            Get-Content "$releaseRoot\latest.json" -Raw | ConvertFrom-Json
          ).package.sha256
          [IO.File]::WriteAllText(
            (Join-Path $releaseRoot 'SHA256SUMS.txt'),
            "$digest  ERP-Automation-Client.zip`n",
            [Text.UTF8Encoding]::new($false)
          )
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Run packaged smoke test
        shell: powershell
        run: |
          $smokeRoot = Join-Path $env:RUNNER_TEMP 'erp-release-smoke'
          $env:ERP_AUTOMATION_HOME = $smokeRoot
          $builtRoot = Join-Path $PWD 'release-staging\dist'
          $builtDirectories = @(Get-ChildItem -LiteralPath $builtRoot -Directory)
          if ($builtDirectories.Count -ne 1) {
            throw "Expected one packaged application directory, found $($builtDirectories.Count)."
          }
          $executables = @(
            Get-ChildItem -LiteralPath $builtDirectories[0].FullName -File -Filter '*.exe'
          )
          if ($executables.Count -ne 1) {
            throw "Expected one top-level application executable, found $($executables.Count)."
          }
          $process = Start-Process `
            -FilePath $executables[0].FullName `
            -ArgumentList '--release-smoke-test' `
            -Wait `
            -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Packaged smoke test failed with exit code $($process.ExitCode)."
          }

      - name: Create or update draft release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.package.outputs.tag }}
          RELEASE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          $releases = @(
            gh release list --limit 100 --json tagName,isDraft | ConvertFrom-Json
          )
          $release = $releases | Where-Object {
            $_.tagName -eq $env:RELEASE_TAG
          } | Select-Object -First 1
          if ($null -ne $release) {
            if (-not $release.isDraft) {
              throw "Release $env:RELEASE_TAG is already published."
            }
            gh release upload $env:RELEASE_TAG `
              'release-output\ERP-Automation-Client.zip' `
              'release-output\latest.json' `
              'release-output\SHA256SUMS.txt' `
              --clobber
          } else {
            gh release create $env:RELEASE_TAG `
              'release-output\ERP-Automation-Client.zip' `
              'release-output\latest.json' `
              'release-output\SHA256SUMS.txt' `
              --draft `
              --target $env:GITHUB_SHA `
              --title "ERP Automation Client $env:RELEASE_VERSION" `
              --notes "Full tests, Windows packaging, and an isolated smoke test passed. The release remains outside the stable update channel until the matching server deployment is healthy."
          }

      - name: Preserve release assets for review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ERP-Automation-Client-${{ steps.package.outputs.version }}
          path: release-output/*
          if-no-files-found: error
          retention-days: 14
