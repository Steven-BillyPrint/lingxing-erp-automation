name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  windows-tests:
    name: Windows tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Install browser used by DOM tests
        run: python -m playwright install chromium

      - name: Validate PowerShell release scripts
        shell: powershell
        run: |
          $scripts = @(
            'scripts\create_release_manifest.ps1',
            'scripts\install_shared_client.ps1',
            'scripts\package_shared_client.ps1',
            'scripts\start_shared_desktop.ps1',
            'scripts\update_shared_client.ps1'
          )
          foreach ($script in $scripts) {
            $errors = $null
            [void][Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script),
              [ref]$null,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | Format-List
              throw "PowerShell parser rejected $script"
            }
          }

      - name: Run complete test suite
        run: python -m pytest -q
