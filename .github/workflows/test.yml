name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  windows-tests:
    name: Windows tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Install browser used by DOM tests
        run: python -m playwright install chromium

      - name: Validate PowerShell release scripts
        shell: powershell
        run: |
          $scripts = @(
            Get-ChildItem -LiteralPath 'scripts' -File -Filter '*.ps1'
          )
          foreach ($script in $scripts) {
            $errors = $null
            [void][Management.Automation.Language.Parser]::ParseFile(
              $script.FullName,
              [ref]$null,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | Format-List
              throw "PowerShell parser rejected $($script.FullName)"
            }
          }

      - name: Validate Linux deployment scripts
        shell: powershell
        run: |
          $bash = 'C:\Program Files\Git\bin\bash.exe'
          if (-not (Test-Path -LiteralPath $bash -PathType Leaf)) {
            throw 'Git Bash is required to validate Linux deployment scripts.'
          }
          $scripts = @(
            Get-ChildItem -LiteralPath 'deploy\server' -File -Filter '*.sh'
          )
          foreach ($script in $scripts) {
            & $bash -n $script.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "Bash parser rejected $($script.FullName)"
            }
          }

      - name: Run complete test suite
        run: python -m pytest -q
