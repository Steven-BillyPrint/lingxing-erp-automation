name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  windows-tests:
    name: Windows tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Validate PowerShell release scripts
        shell: powershell
        run: |
          $scripts = @(
            'scripts\create_release_manifest.ps1',
            'scripts\install_shared_client.ps1',
            'scripts\package_shared_client.ps1',
            'scripts\start_shared_desktop.ps1',
            'scripts\update_shared_client.ps1'
          )
          foreach ($script in $scripts) {
            $errors = $null
            [void][Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script),
              [ref]$null,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | Format-List
              throw "PowerShell parser rejected $script"
            }
          }

      - name: Run complete test suite
        run: python -m pytest -q
